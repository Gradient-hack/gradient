name: gradient
description: "Gradient — a personal walking tour, hosted as a podcast. Hackathon prototype (iOS only)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  apple_maps_flutter: ^1.4.0
  # Real-time PCM mic capture + speaker playback for the Gemini voice relay
  # (same package as the team's reference client in Gradient-hack/gradient).
  audio_io: 0.6.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5

# audio_io 0.6.1 still declares package:web 0.5; its implementation works with 1.x.
dependency_overrides:
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
